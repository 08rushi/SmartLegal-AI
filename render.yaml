# Render Blueprint for the SmartLegal AI API (free web service, Docker).
# Create it with: Render dashboard -> New -> Blueprint -> pick this repo.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: smartlegal-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false          # exactly https://<your-app>.vercel.app (no trailing slash)
      - key: FRONTEND_URL
        sync: false          # same value as ALLOWED_ORIGINS
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
